<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Connexion</title>
  <link rel="stylesheet" href="../css/index.css" />
  <script type="module" src="../javaScript/auth.js"></script>
</head>
<body>

  <!-- ===== BARRE DE CONTACT ===== -->
  <div class="topbar">
    <div class="contact-info">
      <span>📞 (0032) 3 000 00 00</span>
      <span>✉️ exemple@nnnn.be</span>
    </div>
  </div>

  <!-- ===== HEADER PRINCIPAL ===== -->
  <header class="main-header">
    <div class="logo">
      <img src="../img/logo.png" alt="Logo" />
      <span class="logo-text"><b>Nom</b>Du Site</span>
    </div>

    <div class="search-bar">
      <input type="text" placeholder="Rechercher..." />
      <button type="button">🔍</button>
    </div>

    <div class="header-actions">
      <a href="login.html" class="btn-connexion">👤 Connexion</a>
      <a href="register.html" class="btn-inscription">🧾 Inscription</a>
      <div class="lang">🇫🇷 <span>French</span></div>
    </div>
  </header>

  <!-- ===== NAVIGATION ===== -->
  <nav class="main-nav">
    <a href="index.html" class="nav-link">Enchères</a>
    <a href="#" class="nav-link">Lots</a>
    <a href="new-auction.html" class="nav-link">Mettre aux enchères</a>
    <a href="#" class="nav-link">À propos</a>
    <a href="#" class="nav-link">Contact</a>
  </nav>

  <!-- ===== CONTENU PRINCIPAL ===== -->
  <main class="page-form">
    <form id="login-form" class="form-card">
      <h2>Connexion</h2>
      <p id="login-error" class="error"></p>

      <label for="login-email">Email</label>
      <input type="email" id="login-email" required />

      <label for="login-password">Mot de passe</label>
      <input type="password" id="login-password" required />

      <button type="submit">Se connecter</button>

      <p>Pas de compte ? <a href="register.html">S'inscrire</a></p>
    </form>
  </main>

  <script src="../javaScript/login.js"></script>
</body>
</html>

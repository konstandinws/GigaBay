<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nouvelle annonce</title>
  <link rel="stylesheet" href="../css/index.css" />
  <script type="module" src="../javaScript/auth.js" defer></script>
</head>
<body>

  <main class="page-form">
    <form id="new-auction-form" class="form-card">
      <h2>Créer une nouvelle annonce</h2>

      <p><a href="/" id="returnBtn">&larr; Retour aux enchères</a></p>

      <p id="auction-error" class="error"></p>
      <p id="auction-success" class="success"></p>

      <label for="auction-title">
        Titre de l'annonce
      </label>
      <input type="text" id="auction-title" required />

      <label for="auction-description">
        Description
      </label>
      <textarea id="auction-description"></textarea>

      <label for="auction-price">
        Prix de départ (€)
      </label>
      <input
        type="number"
        id="auction-price"
        min="0"
        step="0.01"
        required
      />

      <label for="auction-end-date">
        Date de fin
      </label>
      <input type="datetime-local" id="auction-end-date" />

      <label for="auction-images">
        Images (max 5)
      </label>
      <input type="file" id="auction-images" multiple accept="image/*" />

      <button type="submit">Créer l'annonce</button>
    </form>
  </main>

  <script type="module" src="../javaScript/new-auction.js"></script>
  <script type="module" src="../javaScript/utils/router.js"></script>
</body>
</html>

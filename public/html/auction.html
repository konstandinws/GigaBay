<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Détails de l'enchère</title>
  <link rel="stylesheet" href="/css/index.css">
  <link rel="stylesheet" href="/css/auction.css">
  
  <script type="module" src="/javaScript/auction.js"></script>
  <script type="module" src="/javaScript/auth.js"></script>
</head>
<body>
  
  <main class="container" style="margin-top: 40px;">
    
    <a href="/" class="back-link">
      &larr; Retour à la liste
    </a>

    <div class="auction-layout">
      
      <div class="auction-gallery">
        <div id="main-image-container">
           <img id="main-image" src="" alt="Image principale">
        </div>
        <div id="thumbnails"></div>
      </div>

      <div class="auction-info-panel">
        
        <h1 id="auction-title">Chargement...</h1>
        
        <p id="auction-description"></p>

        <div class="price-card">
            <div class="price-label">Prix actuel</div>
            <div id="current-price">0 €</div>
            
            <div class="timer-container">
                <span>⏱ Fin de l'enchère :</span>
                <span id="auction-timer">--h --m --s</span>
            </div>
        </div>

        <div class="bid-section">
            <label for="bid-amount" class="bid-label">Votre offre (€)</label>
            <div class="bid-input-group">
                <input type="number" id="bid-amount" placeholder="Montant...">
                <button id="btn-place-bid">Enchérir</button>
            </div>
            <p id="bid-error" class="error"></p>
            <p id="bid-success" class="success"></p>
        </div>

      </div>

      <div class="chat-section">
        <h3>Questions & Réponses en direct</h3>
        <div id="chat-box"></div>
        <div class="chat-controls">
            <input type="text" id="chat-input" placeholder="Posez une question...">
            <button id="chat-send">Envoyer</button>
        </div>
      </div>

    </div>
  </main>

  <script src="/socket.io/socket.io.js"></script>
</body>
</html>

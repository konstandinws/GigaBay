<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mon Profil</title>
  <link rel="stylesheet" href="/css/index.css" />
  <link rel="stylesheet" href="/css/profile.css" />
  <script type="module" src="/javaScript/profile.js"></script>
  <script type="module" src="../javaScript/utils/router.js"></script>
</head>
<body>

  <main class="profile-container">
    
    <div class="card profile-header">
      <div class="profile-avatar">
        </div>
      <div class="profile-info">
        <h1 id="user-name">Chargement...</h1>
        <div class="profile-email">
          <span id="user-email">...</span>
        </div>
      </div>
      <button id="logout-btn" class="btn-destructive">Déconnexion</button>
    </div>

    <div class="card balance-card">
      <div class="balance-header">
        <h2>Solde du compte</h2>
      </div>
      <p class="balance-amount">0,00 €</p>
      <button class="btn-secondary">Ajouter des fonds</button>
    </div>

    <div class="card tabs-card">
      <div class="tabs-list">
        <button class="tab-trigger active" data-target="my-auctions">
          📦 Mes enchères
        </button>
      </div>

      <div id="my-auctions" class="tab-content active">
        <div class="tab-header">
          <h3>Enchères que j'ai créées</h3>
          <a href="/new-auction" class="btn-small">➕ Nouvelle enchère</a>
        </div>
        <div id="created-auctions-list" class="auctions-list-container">
          <p class="empty-state">Chargement des enchères...</p>
        </div>
      </div>
    </div>

  </main>

</body>
</html>
